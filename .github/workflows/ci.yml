name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} -t "$IMAGE:sha-${GITHUB_SHA::7}" .

      - name: Test
        run: |
          docker run --rm "$IMAGE:sha-${GITHUB_SHA::7}" caddy list-modules > modules.txt
          for module in layer4.matchers.tls layer4.handlers.proxy layer4.matchers.crowdsec http.handlers.crowdsec; do
            grep -qx "$module" modules.txt || { echo "missing module: $module" >&2; exit 1; }
          done

      - name: Version
        id: version
        if: github.ref == 'refs/heads/main'
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.new_version }}
          TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:sha-${GITHUB_SHA::7}" "$IMAGE:latest"
          docker tag "$IMAGE:sha-${GITHUB_SHA::7}" "$IMAGE:$VERSION"
          docker push --all-tags "$IMAGE"
          gh release create "$TAG" --generate-notes
